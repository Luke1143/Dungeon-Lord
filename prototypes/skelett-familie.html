<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skelett-Familie</title>
<style>
body{margin:0;background:#0f0b09;color:#e8dcc8;font-family:Inter,system-ui,sans-serif;padding:24px 16px 48px}
main{max-width:1060px;margin:0 auto}
h1{font-family:Cinzel,Georgia,serif;color:#d4af37;font-size:1.4rem;margin:0 0 6px}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:#d4af37;margin:26px 0 10px;border-bottom:1px solid #3a2a1d;padding-bottom:6px}
p{color:#a8977e;margin:0 0 14px;font-size:.9rem;line-height:1.5}
.row{display:flex;gap:12px;flex-wrap:wrap}
.card{background:#1c140f;border:1px solid #3a2a1d;padding:8px;text-align:center;width:176px}
.card b{display:block;margin-top:6px;font-size:.85rem}
.card span{display:block;font-size:.72rem;color:#a8977e;margin-top:2px;line-height:1.35}
canvas{image-rendering:pixelated;display:block;margin:0 auto;background:#4a3b2d}
#strip{width:100%;max-width:960px;height:auto;border:1px solid #3a2a1d}
</style></head><body><main>
<h1>Skelett-Familie</h1>
<p>Eine Grundfigur (Skelett C, die Seelenlaterne), sechs Gesichter: Seelenfarbe, Knochenton und Waffe unterscheiden sie. Kein Sprite pro Variante, nur eine Tabelle. Die Seele flackert.</p>
<h2>Die Familie</h2><div class="row" id="big"></div>
<h2>Echte Größe: Kachel 32 px, Figur 16 px, 2-fach und 3-fach</h2>
<canvas id="strip" width="960" height="150"></canvas>
<script>
const N=16;
const mk=(w,h)=>({w,h,g:Array.from({length:h},()=>Array(w).fill('.'))});
const put=(p,x,y,c)=>{ if(x>=0&&y>=0&&x<p.w&&y<p.h) p.g[y][x]=c; };
function ell(p,cx,cy,rx,ry,c){ for(let y=0;y<p.h;y++) for(let x=0;x<p.w;x++){ const dx=(x+.5-cx)/rx, dy=(y+.5-cy)/ry; if(dx*dx+dy*dy<=1) put(p,x,y,c); } }
function shade(p,base,light,dark){ const at=(x,y)=>(x<0||y<0||x>=p.w||y>=p.h)?'.':p.g[y][x], o=p.g.map(r=>r.slice());
  for(let y=0;y<p.h;y++) for(let x=0;x<p.w;x++) if(p.g[y][x]===base){ if(at(x,y+1)==='.'||at(x+1,y)==='.') o[y][x]=dark; else if(at(x,y-1)==='.'||(at(x-1,y)==='.'&&y<p.h/2)) o[y][x]=light; }
  p.g=o; return p; }
function blit(dst,part,ox,oy){ for(let y=0;y<part.h;y++) for(let x=0;x<part.w;x++){ const c=part.g[y][x]; if(c!=='.') put(dst,ox+x,oy+y,c); } }
const eye=(p,x,y,w,h,px,py)=>{ for(let j=0;j<h;j++) for(let i=0;i<w;i++) put(p,x+i,y+j,'p'); put(p,px,py,'e'); };
// ---------- base figure: small skull, ring chest with a soul, stick legs ----------
function skull(helm){
  const sk=mk(7,6); ell(sk,3.5,2.7,3.2,2.7,'s'); shade(sk,'s','S','z');
  eye(sk,1,2,2,2,1,2); eye(sk,4,2,2,2,4,2); put(sk,3,4,'p'); [1,2,3,4,5].forEach((x,i)=>put(sk,x,5,i%2?'p':'w'));
  if(helm){ for(let y=0;y<=1;y++) for(let x=0;x<7;x++) if(sk.g[y][x]!=='.') sk.g[y][x]= y===0?'M':'m'; [0,6].forEach(x=>{ for(let y=2;y<=3;y++) if(sk.g[y][x]!=='.') sk.g[y][x]='n'; }); put(sk,3,2,'m'); }
  return sk;
}
function ring(flick){
  const r=mk(10,6); ell(r,5,3,4.8,2.9,'s'); ell(r,5,3,3.3,1.9,'p'); shade(r,'s','S','z'); for(let x=2;x<=7;x++) put(r,x,2,'u');
  put(r,4,3,'y'); put(r,5,3,'y'); put(r,4,4,'Y'); put(r,5,4,'Y'); if(flick){ put(r,3,3,'Y'); put(r,6,3,'Y'); put(r,5,2,'Y'); }
  return r;
}
const WEAPONS={
  schwert:{ w:3,h:9, px:[[1,0,'W'],[1,1,'W'],[1,2,'W'],[1,3,'W'],[1,4,'W'],[1,5,'W'],[0,6,'K'],[1,6,'K'],[2,6,'K'],[1,7,'k'],[1,8,'k']] },
  axt:{ w:4,h:9, px:[[1,2,'k'],[1,3,'k'],[1,4,'k'],[1,5,'k'],[1,6,'k'],[1,7,'k'],[1,8,'k'],[2,0,'W'],[3,0,'W'],[2,1,'W'],[3,1,'W'],[2,2,'W'],[3,2,'W'],[2,3,'W']] },
  stab:{ w:3,h:9, px:[[0,0,'Q'],[1,0,'Q'],[2,0,'Q'],[0,1,'Q'],[1,1,'q'],[2,1,'Q'],[1,2,'Q'],[1,3,'k'],[1,4,'k'],[1,5,'k'],[1,6,'k'],[1,7,'k'],[1,8,'k']] },
  sense:{ w:5,h:11, px:[[0,2,'W'],[1,1,'W'],[2,0,'W'],[3,0,'W'],[4,1,'W'],[3,1,'k'],[3,2,'k'],[3,3,'k'],[3,4,'k'],[3,5,'k'],[3,6,'k'],[3,7,'k'],[3,8,'k'],[3,9,'k'],[3,10,'k']] }
};
function figure(v,t){
  const f=mk(N,N), k=t%4, bob=[0,-1,0,-1][k], ff=[-1,0,1,0][k], fb=-ff, nod=[0,0,1,0][k], flick=(Math.floor(t/2)%2)===0;
  for(let x=4;x<=12;x++) put(f,x,15,'k');
  if(v.weapon){ const w=WEAPONS[v.weapon]; w.px.forEach(([x,y,c])=>put(f,13-(w.w>3?1:0)+x,4+y+bob,c)); }
  const leg=(x,y)=>{ for(let j=0;j<3;j++) put(f,x,y+j,'z'); put(f,x,y+2,'s'); };
  leg(6+ff,12); leg(9+fb,12);
  blit(f,ring(flick),3,6+bob); blit(f,skull(v.helm),4,bob+nod);
  return f;
}
// ---------- the family: only table entries ----------
const BASE={ s:'#e8dcc8',S:'#faf3e4',z:'#b8ab94',u:'#8f836f',p:'#14100c',e:'#ffffff',w:'#f2e8d5',k:'#6b4a2f',y:'#ffd23f',Y:'#ff9a3c',W:'#c4cad1',K:'#575e66',Q:'#9a6aff',q:'#e8d8ff',m:'#8d949c',M:'#c4cad1',n:'#575e66' };
const FAMILY=[
 { name:'Gefallener Held', note:'Goldene Seele, Knochenfarben, Schwert. Das Original.', pal:{}, weapon:'schwert' },
 { name:'Wächter', note:'Gleicher Held mit Eisenhelm. Rüstung färbt nur um, kein neues Sprite.', pal:{}, weapon:'schwert', helm:true },
 { name:'Giftmagier', note:'Grüne Seele, grünlicher Knochen, Stab.', pal:{s:'#d2dcb8',S:'#ecf3d8',z:'#a3b088',u:'#7a8664',y:'#7dff3a',Y:'#2fb81a',Q:'#7dff3a',q:'#d8ffc0'}, weapon:'stab' },
 { name:'Feuerseele', note:'Orange Seele, warmer Knochen, ohne Waffe: die Seele ist die Waffe.', pal:{s:'#ecd6b8',S:'#fbeedb',z:'#bfa07c',u:'#8f6c4a',y:'#ff8a1a',Y:'#ffd23f'}, weapon:null },
 { name:'Frostwache', note:'Blaue Seele, bläulicher Knochen, Axt.', pal:{s:'#d4e4f0',S:'#eef7ff',z:'#9fb4c6',u:'#6c8296',y:'#7fe0ff',Y:'#3aa8d8'}, weapon:'axt' },
 { name:'Blutschnitter', note:'Rote Seele, dunkler Knochen, Sense.', pal:{s:'#dcc4bc',S:'#f2dcd4',z:'#a8887e',u:'#7a5a50',y:'#ff3a3a',Y:'#a01212'}, weapon:'sense' }
];
function paint(ctx,f,pal,ox,oy,s){ const P={...BASE,...pal,k:undefined}; f.g.forEach((row,y)=>row.forEach((c,x)=>{ if(c==='.') return; ctx.fillStyle=(c==='k'?'rgba(0,0,0,0.30)':(P[c]||BASE[c])||'#f0f'); ctx.fillRect(ox+x*s,oy+y*s,s,s); })); }
// weapon wood colour must stay brown while the shadow is a grey: use 'k' for the shadow row and 'k' wood in sprites -> separate with 'j'
let t=0; const big=document.getElementById('big'), ctxs=[];
FAMILY.forEach(v=>{ const c=document.createElement('canvas'); c.width=160; c.height=160; const d=document.createElement('div'); d.className='card'; d.appendChild(c); d.insertAdjacentHTML('beforeend','<b>'+v.name+'</b><span>'+v.note+'</span>'); big.appendChild(d); ctxs.push(c.getContext('2d')); });
function tick(){ t++;
  FAMILY.forEach((v,i)=>{ const x=ctxs[i]; x.fillStyle='#4a3b2d'; x.fillRect(0,0,160,160); paint(x,figure(v,t),v.pal,0,0,10); });
  const c=document.getElementById('strip'), x=c.getContext('2d'); x.fillStyle='#4a3b2d'; x.fillRect(0,0,960,150);
  FAMILY.forEach((v,i)=>{ const ox=14+i*155; x.strokeStyle='#33271c'; x.strokeRect(ox,10,32,32); paint(x,figure(v,t),v.pal,ox,10,2); paint(x,figure(v,t),v.pal,ox+50,10,3); });
}
setInterval(tick,140); tick();
</script></main></body></html>
