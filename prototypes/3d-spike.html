function spriteTexture(def){
  const n=def.rows.length, h=n/2;   // 16 px figures or 32 px creatures
  const g=Array.from({length:n},()=>Array(n).fill('.'));
  def.rows.forEach((r,y)=>{ for(let x=0;x<h;x++){ g[y][x]=r[x]; g[y][n-1-x]=r[x]; } });
  (def.over||[]).forEach(([x,y,c])=>g[y][x]=c);
  const c=document.createElement('canvas'); c.width=n; c.height=n; const x=c.getContext('2d');
  g.forEach((row,yy)=>row.forEach((ch,xx)=>{ if(ch==='.') return; x.fillStyle=def.pal[ch]||'#f0f'; x.fillRect(xx,yy,1,1); }));
  const t=new THREE.CanvasTexture(c); t.magFilter=THREE.NearestFilter; t.minFilter=THREE.NearestFilter; t.generateMipmaps=false;
  return t;
}

// ---- Modular imp (see imp-parts.html): head, body, legs, sack; animation by whole-pixel offsets ----
const IMP_PAL={ o:'#d9622b', h:'#f08a4b', O:'#8f3a1a', R:'#5a1810', p:'#14100c', e:'#ffffff', b:'#c9a96a', B:'#8a7048', y:'#f4d03f', Y:'#b8860b', g:'#aab3bd', G:'#6b7580', s:'rgba(0,0,0,0.30)' };
const IMP_N=16;
const impMk=(w,h)=>({w,h,g:Array.from({length:h},()=>Array(w).fill('.'))});
const impPut=(p,x,y,c)=>{ if(x>=0&&y>=0&&x<p.w&&y<p.h) p.g[y][x]=c; };
function impEll(p,cx,cy,rx,ry,c){ for(let y=0;y<p.h;y++) for(let x=0;x<p.w;x++){ const dx=(x+.5-cx)/rx, dy=(y+.5-cy)/ry; if(dx*dx+dy*dy<=1) impPut(p,x,y,c); } }
function impCap(p,x0,y0,x1,y1,r,c){ for(let y=0;y<p.h;y++) for(let x=0;x<p.w;x++){ const px=x+.5,py=y+.5,vx=x1-x0,vy=y1-y0,L=vx*vx+vy*vy||1; let t=((px-x0)*vx+(py-y0)*vy)/L; t=Math.max(0,Math.min(1,t)); const dx=px-(x0+vx*t),dy=py-(y0+vy*t); if(dx*dx+dy*dy<=r*r) impPut(p,x,y,c); } }
function impShade(p,base,light,dark){ const at=(x,y)=>(x<0||y<0||x>=p.w||y>=p.h)?'.':p.g[y][x], o=p.g.map(r=>r.slice());
  for(let y=0;y<p.h;y++) for(let x=0;x<p.w;x++) if(p.g[y][x]===base){ if(at(x,y+1)==='.'||at(x+1,y)==='.') o[y][x]=dark; else if(at(x,y-1)==='.'||(at(x-1,y)==='.'&&y<p.h/2)) o[y][x]=light; }
  p.g=o; return p; }
const IMP_PARTS=(()=>{
  const head=impMk(9,8); impEll(head,4.5,4.1,4.5,3.9,'o'); impShade(head,'o','h','O');
  [[1,2],[5,2]].forEach(([x,y])=>{ for(let j=0;j<3;j++){ impPut(head,x,y+j,'p'); impPut(head,x+1,y+j,'p'); } impPut(head,x,y+1,'e'); });
  const body=impMk(8,7); impEll(body,4,3.6,4,3.5,'o'); impEll(body,3.2,4.3,2,1.8,'h'); impShade(body,'o','h','O');
  const leg=impMk(3,4); impCap(leg,1.5,0.6,1.5,3.0,1.1,'o'); impShade(leg,'o','h','O'); [0,1,2].forEach(x=>impPut(leg,x,3,'R'));
  const sack=c=>{ const p=impMk(8,8); impEll(p,4,4.9,3.9,3.1,'b'); [[3,1],[4,1],[2,0],[5,0]].forEach(([x,y])=>impPut(p,x,y,'b')); impPut(p,3,0,'B'); impPut(p,4,0,'B'); impShade(p,'b','b','B');
    const gl=c==='gold'?['y','Y']:c==='ore'?['g','G']:null; if(gl){ impPut(p,2,4,gl[0]); impPut(p,3,3,gl[0]); impPut(p,5,5,gl[0]); impPut(p,5,3,gl[1]); impPut(p,3,6,gl[1]); } return p; };
  return { head, body, leg, sack:{gold:sack('gold'),ore:sack('ore')} };
})();
function impBlit(dst,part,ox,oy){ for(let y=0;y<part.h;y++) for(let x=0;x<part.w;x++){ const c=part.g[y][x]; if(c!=='.') impPut(dst,ox+x,oy+y,c); } }
// state: 'stehen' | 'laufen' | 'gold' | 'erz'
function impFrame(state,t,facingRight){
  const f=impMk(IMP_N,IMP_N), carry=state==='gold'||state==='erz', walk=state!=='stehen', hunch=carry?1:0, k=t%4;
  const bob=walk?[0,-1,0,-1][k]:0, footF=walk?[-1,0,1,0][k]:0, footB=-footF, headLag=walk?[0,0,1,0][k]:(Math.floor(t/2)%2?1:0);
  for(let x=4;x<=12;x++) impPut(f,x,15,'s');
  impBlit(f,IMP_PARTS.leg,10+footB,11);
  if(carry) impBlit(f,IMP_PARTS.sack[state==='gold'?'gold':'ore'],8,1+hunch+bob+(walk&&k===2?1:0));
  impBlit(f,IMP_PARTS.body,6,5+hunch+bob);
  impBlit(f,IMP_PARTS.leg,5+footF,11);
  impBlit(f,IMP_PARTS.head,1,1+hunch+bob+headLag);
  if(facingRight) f.g=f.g.map(r=>r.slice().reverse());
  return f;
}
const IMP_TEX={};   // cache: state|frame|facing -> texture
function impTexture(state,t,facingRight){
  const key=state+'|'+(state==='stehen'?(t%4>=2?2:0):t%4)+'|'+(facingRight?1:0);
  if(IMP_TEX[key]) return IMP_TEX[key];
  const f=impFrame(state,t,facingRight), c=document.createElement('canvas'); c.width=IMP_N; c.height=IMP_N; const x=c.getContext('2d');
  f.g.forEach((row,yy)=>row.forEach((ch,xx)=>{ if(ch==='.') return; x.fillStyle=IMP_PAL[ch]; x.fillRect(xx,yy,1,1); }));
  const tex=new THREE.CanvasTexture(c); tex.magFilter=THREE.NearestFilter; tex.minFilter=THREE.NearestFilter; tex.generateMipmaps=false; tex.colorSpace=THREE.SRGBColorSpace;
  return IMP_TEX[key]=tex;
}

// ---- Tile textures (32x32, from the sprite sample) ----
function rng(seed){let t=seed;return()=>((t=Math.imul(t^t>>>15,t|1)),(t^=t+Math.imul(t^t>>>7,t|61)),((t^t>>>14)>>>0)/4294967296)}
const N=32;
function tileCanvas(kind,seed,shade){
  const r=rng(seed),g=Array.from({length:N},()=>Array(N).fill(0));
  const P={floor:['#7d6850','#715d47','#8a7459'],rock:['#4a3a2b','#3f3125','#574531'],
    throne:['#58306a','#4a2859','#693d7e'],vein:['#2b2118','#241b14','#34281d'],
    rockTop:['#6b6470','#5f5966','#77707d'],water:['#2f5d8a','#2a5580','#3a6a9a']}[kind];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const v=r();g[y][x]=v<.62?P[0]:v<.84?P[1]:P[2];}
  if(kind==='rock'||kind==='vein'){for(let i=0;i<6;i++){let x=2+Math.floor(r()*(N-4)),y=2+Math.floor(r()*(N-8));for(let j=0;j<6;j++){g[y][x]='#17110c';x+=r()<.5?1:0;y+=1;if(x>N-1||y>N-1)break;}}}
  if(kind==='vein'){for(let i=0;i<7;i++){const x=2+Math.floor(r()*(N-5)),y=2+Math.floor(r()*(N-5));g[y][x]='#f4d03f';g[y][x+1]='#f4d03f';g[y+1][x]='#b8860b';g[y+1][x+1]='#b8860b';g[y][x+2]='#b8860b';}}
  if(kind==='throne'){for(let i=0;i<N;i++){for(const k of [0,15,16,31]){g[k][i]='#3a1f48';g[i][k]='#3a1f48';}}for(let i=1;i<N-1;i++){g[1][i]=g[1][i]==='#3a1f48'?g[1][i]:'#7b4a92';g[17][i]='#7b4a92';}}
  const c=document.createElement('canvas'); c.width=N; c.height=N; const x=c.getContext('2d');
  g.forEach((row,yy)=>row.forEach((col,xx)=>{x.fillStyle=col;x.fillRect(xx,yy,1,1);}));
  return c;
}
function tex(kind,seed){
  const t=new THREE.CanvasTexture(tileCanvas(kind,seed)); t.magFilter=THREE.NearestFilter; t.minFilter=THREE.NearestFilter; t.generateMipmaps=false; t.colorSpace=THREE.SRGBColorSpace; return t;
}

// ---- Scene ----
const host=document.getElementById('view');
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));
renderer.setSize(innerWidth,innerHeight); host.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0f0b09); scene.fog=new THREE.Fog(0x0f0b09,18,46);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,200);
scene.add(new THREE.AmbientLight(0x8a82a0,1.5));
const sun=new THREE.DirectionalLight(0xffe0b0,0.9); sun.position.set(-6,14,8); scene.add(sun);

const COLS=40, ROWS=28, WALL=1.0;
let grid, world, sprites, marked, torches;
const T={
  rockSide:tex('rock',3), rockTop:tex('rockTop',4), vein:tex('vein',7), floor:[tex('floor',5),tex('floor',6),tex('floor',8)], throne:tex('throne',9), water:tex('water',11)
};
const matLambert=(map)=>new THREE.MeshLambertMaterial({map});
const M={
  rock:[matLambert(T.rockSide),matLambert(T.rockSide),matLambert(T.rockTop),matLambert(T.rockSide),matLambert(T.rockSide),matLambert(T.rockSide)],
  vein:[matLambert(T.vein),matLambert(T.vein),matLambert(T.rockTop),matLambert(T.vein),matLambert(T.vein),matLambert(T.vein)],
  floor:T.floor.map(matLambert), throne:matLambert(T.throne), water:new THREE.MeshLambertMaterial({map:T.water,transparent:true,opacity:0.9})
};
const boxGeo=new THREE.BoxGeometry(1,WALL,1), flatGeo=new THREE.PlaneGeometry(1,1); flatGeo.rotateX(-Math.PI/2);
const hover=new THREE.Mesh(new THREE.BoxGeometry(1.02,0.04,1.02), new THREE.MeshBasicMaterial({color:0xffe27a,transparent:true,opacity:0.3}));
hover.visible=false; scene.add(hover);

function buildMap(seed){
  const r=rng(seed);
  const ri=(a,b)=>a+Math.floor(r()*(b-a+1));
  grid=Array.from({length:ROWS},()=>Array(COLS).fill('R'));
  const carve=(x0,y0,x1,y1,k)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)grid[y][x]=k;};
  carve(2,2,5,5,'T');                       // throne room
  carve(6,3,14,3,'F'); carve(14,3,14,12,'F'); // corridor
  carve(10,12,19,18,'F');                  // hall
  carve(19,15,30,15,'F'); carve(30,10,36,20,'F');
  for(let i=0;i<5;i++){ const x=ri(8,COLS-8),y=ri(6,ROWS-6); for(let k=0;k<30;k++){ grid[Math.max(2,Math.min(ROWS-3,y+ri(-3,3)))][Math.max(2,Math.min(COLS-3,x+ri(-4,4)))]='F'; } }
  for(let i=0;i<4;i++){ const x=ri(8,COLS-8),y=ri(5,ROWS-5); for(let k=0;k<14;k++){ const yy=y+ri(-2,2),xx=x+ri(-3,3); if(grid[yy]&&grid[yy][xx]==='R') grid[yy][xx]='W'; } }
  for(let i=0;i<9;i++){ const x=ri(6,COLS-7),y=ri(6,ROWS-7); for(let k=0;k<7;k++){ const yy=y+ri(-1,1),xx=x+ri(-2,2); if(grid[yy][xx]==='R') grid[yy][xx]='V'; } }
}
function clearWorld(){ if(world) scene.remove(world); world=new THREE.Group(); scene.add(world); sprites=[]; marked=new Set(); torches=[]; }
function build(seed){
  buildMap(seed); clearWorld();
  const tiles=new THREE.Group(); world.add(tiles);
  const pickable=[];
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    const k=grid[y][x]; let m;
    if(k==='R'||k==='V'){
      m=new THREE.Mesh(boxGeo,k==='V'?M.vein:M.rock); m.position.set(x+0.5,WALL/2,y+0.5);
    } else {
      m=new THREE.Mesh(flatGeo,k==='T'?M.throne:k==='W'?M.water:M.floor[(x*7+y*13)%3]); m.position.set(x+0.5,k==='W'?-0.05:0,y+0.5);
      if(k==='W'){ const bed=new THREE.Mesh(flatGeo,M.floor[0]); bed.position.set(x+0.5,-0.15,y+0.5); tiles.add(bed); }
    }
    m.userData={x,y,k}; tiles.add(m); pickable.push(m);
  }
  world.userData.pickable=pickable;
  // throne torches
  [[1.2,1.2],[5.8,1.2],[1.2,5.8],[5.8,5.8]].forEach(([x,z])=>{
    const l=new THREE.PointLight(0xff8a3c,2.2,9,1.6); l.position.set(x,1.2,z); world.add(l); torches.push(l);
    const f=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.12,0.12),new THREE.MeshBasicMaterial({color:0xffb347})); f.position.copy(l.position); world.add(f);
  });
  // sprites
  const texs={}; for(const k in SPR) texs[k]=spriteTexture(SPR[k]);
  const floors=[]; for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++) if(grid[y][x]==='F'||grid[y][x]==='T') floors.push([x,y]);
  const slot=[[0.28,0.28],[0.72,0.28],[0.28,0.72],[0.72,0.72]];
  const add=(kind,x,y,s,wander)=>{
    const big=SPR[kind].rows.length===32;
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:texs[kind],transparent:true,alphaTest:0.1}));
    sp.center.set(0.5,0); sp.scale.set(big?1:0.5,big?1:0.5,1);
    const o={sp,x,y,s:s||0,wander,tx:x,ty:y,t:0};
    sp.position.set(x+slot[o.s][0],0,y+slot[o.s][1]); o.big=big; world.add(sp); sprites.push(o); return o;
  };
  add('lord',3,3,0); add('warlock',4,4,0);
  add('hero',15,13,1); add('hero',16,14,0);
  add('gold',12,14,0);
  add('hound',5,3,0).fixed=true;
  // modular imps: some walk empty-handed, some carry gold or ore on their back
  const addImp=(x,y,state)=>{
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:impTexture(state,0,false),transparent:true,alphaTest:0.1}));
    sp.center.set(0.5,0); sp.scale.set(0.5,0.5,1); sp.position.set(x+0.5,0,y+0.5); world.add(sp);
    const o={sp,x,y,s:0,wander:true,tx:x,ty:y,t:0,imp:true,state,facingRight:false,frame:0,frameT:Math.random()*0.14,pause:0}; sprites.push(o); return o;
  };
  const states=['laufen','gold','laufen','erz','gold','laufen','erz','laufen','gold','laufen'];
  states.forEach((st,i)=>{ const f=floors[Math.floor(Math.random()*floors.length)]; addImp(f[0],f[1],st); });
  addImp(7,3,'gold'); addImp(7,3,'erz'); addImp(6,3,'laufen');
}
function stepWander(o){
  const d=[[1,0],[-1,0],[0,1],[0,-1]][Math.floor(Math.random()*4)];
  const nx=o.x+d[0], ny=o.y+d[1];
  if(grid[ny]&&(grid[ny][nx]==='F'||grid[ny][nx]==='T')){ o.tx=nx; o.ty=ny; }
}

// ---- Camera ----
const cam={ tx:12, tz:10, yaw:0.0, pitch:0.95, dist:16 };
const keys={};
addEventListener('keydown',e=>{ keys[e.key.toLowerCase()]=true; if(e.key.toLowerCase()==='r') build(Math.floor(Math.random()*1e6)); });
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
let rdrag=null;
renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
renderer.domElement.addEventListener('mousedown',e=>{ if(e.button===2) rdrag={x:e.clientX,y:e.clientY,yaw:cam.yaw,pitch:cam.pitch}; });
addEventListener('mouseup',e=>{ if(e.button===2) rdrag=null; });
addEventListener('mousemove',e=>{
  mouse.x=e.clientX/innerWidth*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
  if(rdrag){ cam.yaw=rdrag.yaw-(e.clientX-rdrag.x)*0.005; cam.pitch=Math.max(0.35,Math.min(1.35,rdrag.pitch+(e.clientY-rdrag.y)*0.004)); }
});
renderer.domElement.addEventListener('wheel',e=>{ e.preventDefault(); cam.dist=Math.max(5,Math.min(40,cam.dist*Math.pow(1.0012,e.deltaY))); },{passive:false});
addEventListener('resize',()=>{ renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); });

const mouse=new THREE.Vector2(0,0), ray=new THREE.Raycaster();
const info=document.getElementById('info');
let hoverTile=null;
renderer.domElement.addEventListener('click',e=>{
  if(!hoverTile) return;
  const {x,y,k}=hoverTile;
  if(k!=='R'&&k!=='V') return;
  const key=x+','+y;
  if(marked.has(key)){ world.remove(marked.get?0:0); }
  toggleMark(x,y);
});
const markMeshes=new Map();
function toggleMark(x,y){
  const key=x+','+y;
  if(markMeshes.has(key)){ world.remove(markMeshes.get(key)); markMeshes.delete(key); return; }
  const m=new THREE.Mesh(new THREE.BoxGeometry(1.03,WALL+0.03,1.03),new THREE.MeshBasicMaterial({color:0xd4af37,transparent:true,opacity:0.35}));
  m.position.set(x+0.5,WALL/2,y+0.5); world.add(m); markMeshes.set(key,m);
}

let last=performance.now(), tickAcc=0;
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  // pan relative to yaw
  let dx=0,dz=0;
  if(keys['w']||keys['arrowup']) dz-=1; if(keys['s']||keys['arrowdown']) dz+=1;
  if(keys['a']||keys['arrowleft']) dx-=1; if(keys['d']||keys['arrowright']) dx+=1;
  if(keys['q']) cam.yaw+=dt*1.4; if(keys['e']) cam.yaw-=dt*1.4;
  if(dx||dz){
    const sp=cam.dist*0.9*dt, c=Math.cos(cam.yaw), s=Math.sin(cam.yaw);
    cam.tx+=(dx*c+dz*s)*sp; cam.tz+=(-dx*s+dz*c)*sp;
    cam.tx=Math.max(0,Math.min(COLS,cam.tx)); cam.tz=Math.max(0,Math.min(ROWS,cam.tz));
  }
  camera.position.set(cam.tx+Math.sin(cam.yaw)*Math.cos(cam.pitch)*cam.dist, Math.sin(cam.pitch)*cam.dist, cam.tz+Math.cos(cam.yaw)*Math.cos(cam.pitch)*cam.dist);
  camera.lookAt(cam.tx,0,cam.tz);
  // wandering imps
  tickAcc+=dt;
  const camRight={x:Math.cos(cam.yaw), z:-Math.sin(cam.yaw)};   // screen-right direction on the ground
  sprites.forEach(o=>{
    if(o.imp){
      // walk tile to tile at a constant speed, pause now and then
      if(o.pause>0){ o.pause-=dt; }
      else {
        const dx=o.tx-o.x, dy=o.ty-o.y, dist=Math.hypot(dx,dy);
        if(dist<0.02){ if(Math.random()<0.25){ o.pause=0.4+Math.random()*1.2; } else stepWander(o); }
        else {
          const sp=Math.min(dist, 1.8*dt); o.x+=dx/dist*sp; o.y+=dy/dist*sp;
          const side=dx*camRight.x+dy*camRight.z;       // movement on screen: left or right
          if(Math.abs(side)>0.05) o.facingRight=side>0;
        }
      }
      const moving=o.pause<=0 && Math.hypot(o.tx-o.x,o.ty-o.y)>0.02;
      o.frameT+=dt; if(o.frameT>0.14){ o.frameT=0; o.frame++; }
      const st=moving?o.state:(o.state==='laufen'?'stehen':o.state);   // carriers keep their pose while resting
      o.sp.material.map=impTexture(st==='stehen'?'stehen':st, st==='stehen'?o.frame*2:o.frame, o.facingRight);
      o.sp.position.set(o.x+0.5, 0, o.y+0.5);
      return;
    }
    if(o.wander && tickAcc>0.55){ stepWander(o); }
    const px=(o.tx+0.0), py=(o.ty+0.0);
    o.x+=(px-o.x)*Math.min(1,dt*3.2); o.y+=(py-o.y)*Math.min(1,dt*3.2);
    o.sp.position.set(o.x+(o.big?0.5:[0.28,0.72,0.28,0.72][o.s]), 0.0+(o.wander?Math.abs(Math.sin(now/110+o.s))*0.05:0), o.y+(o.big?0.5:[0.28,0.28,0.72,0.72][o.s]));
  });
  if(tickAcc>0.55) tickAcc=0;
  torches.forEach((l,i)=>{ l.intensity=2.0+Math.sin(now/130+i*2)*0.35+Math.sin(now/53+i)*0.15; });
  // picking
  ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(world.userData.pickable,false)[0];
  if(hit){
    const u=hit.object.userData; hoverTile=u;
    hover.visible=true; const top=(u.k==='R'||u.k==='V')?WALL:0.02; hover.position.set(u.x+0.5,top+0.02,u.y+0.5);
    const names={R:'Fels',V:'Goldader',F:'Gang',T:'Thronsaal',W:'Wasser'};
    info.textContent=`${names[u.k]} (${u.x}, ${u.y})`;
  } else { hoverTile=null; hover.visible=false; info.textContent='Maus über eine Kachel…'; }
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
build(7);
requestAnimationFrame(frame);
</script></body></html>
